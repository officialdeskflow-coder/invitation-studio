<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="{{themeColor}}">
<title>{{seo.title}}</title>
<meta name="description" content="{{seo.description}}">
{{#if seo.noindex}}<meta name="robots" content="noindex,nofollow">{{/if}}
<meta property="og:type" content="website"><meta property="og:title" content="{{seo.title}}"><meta property="og:description" content="{{seo.description}}">
{{#if seo.ogImageUrl}}<meta property="og:image" content="{{seo.ogImageUrl}}"><meta property="og:image:type" content="{{seo.ogImageType}}"><meta property="og:image:width" content="{{seo.ogImageW}}"><meta property="og:image:height" content="{{seo.ogImageH}}"><meta property="og:image:alt" content="{{seo.ogImageAlt}}"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="{{seo.title}}"><meta name="twitter:description" content="{{seo.description}}"><meta name="twitter:image" content="{{seo.ogImageUrl}}">{{/if}}
{{#if seo.url}}<meta property="og:url" content="{{seo.url}}"><link rel="canonical" href="{{seo.url}}">{{/if}}
<link rel="icon" href="data:image/svg+xml,{{{faviconSvg}}}">
<script>document.documentElement.classList.add('js')</script>
{{{headAssets}}}
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;font:18px system-ui">Please turn on JavaScript to open this invitation.</p></noscript>
{{{scripts}}}
</body>
</html>
