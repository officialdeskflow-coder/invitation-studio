<section class="cd" id="cd" aria-labelledby="cdt">
  <h2 id="cdt" class="rv">{{countdown.title}}</h2>
  <p class="vh" id="cdsr"></p>
  <div class="cells" aria-hidden="true">
   <div class="cell rv"><span class="num" id="n-d"><b>---</b></span><span class="lab">{{countdown.labels.days}}</span></div>
   <div class="cell rv"><span class="num" id="n-h"><b>--</b></span><span class="lab">{{countdown.labels.hours}}</span></div>
   <div class="cell rv"><span class="num" id="n-m"><b>--</b></span><span class="lab">{{countdown.labels.minutes}}</span></div>
   <div class="cell rv"><span class="num" id="n-s"><b>--</b></span><span class="lab">{{countdown.labels.seconds}}</span></div>
  </div>
  <p class="today" id="today" hidden>{{countdown.today}}</p>
 </section>
