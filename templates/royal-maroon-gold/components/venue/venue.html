<section class="ven" id="ven" aria-labelledby="vt"><svg class="lf" style="left:8%;--d:13s;--dl:-2s;--dx:40px;--r:200deg" viewBox="-1 -8 22 16" aria-hidden="true"><path d="M0 0C4-7 14-7 20 0C14 7 4 7 0 0ZM0 0H20"/></svg><svg class="lf" style="left:27%;--d:10s;--dl:-6s;--dx:-30px;--r:-160deg" viewBox="-1 -8 22 16" aria-hidden="true"><path d="M0 0C4-7 14-7 20 0C14 7 4 7 0 0ZM0 0H20"/></svg><svg class="lf" style="left:52%;--d:14s;--dl:-9s;--dx:50px;--r:240deg" viewBox="-1 -8 22 16" aria-hidden="true"><path d="M0 0C4-7 14-7 20 0C14 7 4 7 0 0ZM0 0H20"/></svg><svg class="lf" style="left:71%;--d:11s;--dl:-4s;--dx:-40px;--r:180deg" viewBox="-1 -8 22 16" aria-hidden="true"><path d="M0 0C4-7 14-7 20 0C14 7 4 7 0 0ZM0 0H20"/></svg><svg class="lf" style="left:90%;--d:12s;--dl:-8s;--dx:-20px;--r:-220deg" viewBox="-1 -8 22 16" aria-hidden="true"><path d="M0 0C4-7 14-7 20 0C14 7 4 7 0 0ZM0 0H20"/></svg>

  <a class="open mb rv" href="{{venue.mapUrl}}" target="_blank" rel="noopener noreferrer">{{venue.mapButton}}</a>
  {{#if venue.note}}<p class="note rv">{{venue.note}}</p>{{/if}}
 </section>
