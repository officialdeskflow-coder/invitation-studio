<section class="clo" id="clo" aria-labelledby="clt">{{{svg.petals}}}
  <div class="flr sp sp-l" aria-hidden="true">{{{svg.sprigLeft}}}</div><div class="flr sp sp-r" aria-hidden="true">{{{svg.sprigRight}}}</div>
  <h2 id="clt" class="rv h2">{{closing.title}}</h2>
  <p class="cn2 rv">{{couple.first}} {{couple.joiner}} {{couple.second}}</p>
  <div class="ringph rv"><div class="ph" id="ph">{{#if closing.photo}}<img src="{{img:closing.photo}}" width="500" height="667" alt="{{closing.photoAlt}}" decoding="async">{{/if}}</div><span class="wr2" aria-hidden="true">{{{svg.wreath}}}</span></div>
  <p class="love rv">{{closing.love}}</p>
  <button class="top rv" id="top" type="button" aria-label="{{closing.topButton}}"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#arrowup"/></svg></button>
 </section>
