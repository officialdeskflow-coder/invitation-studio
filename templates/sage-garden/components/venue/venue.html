<section class="ven" id="ven" aria-labelledby="vt">{{{svg.petals}}}
  <h2 id="vt" class="rv h2">{{venue.title}}</h2>
  <p class="vn rv">{{venue.name}}</p><p class="va rv">{{venue.city}}</p>
  {{#if venue.illustration}}<div class="pav" id="mand" role="img" aria-label="{{venue.illustrationAlt}}">{{{svg.gazebo}}}</div>{{/if}}
  <div class="map rv"><svg viewBox="0 0 330 190" role="img" aria-label="Illustrated map marking the venue"><rect width="330" height="190" fill="#2f4a3c"/><path d="M-10 120C60 95 120 150 200 110S300 70 345 90" fill="none" stroke="#486a58" stroke-width="16" stroke-linecap="round"/><g fill="none" stroke="#f6f1e7" stroke-opacity=".28"><path d="M0 150L330 80M40 0L110 190M230 0C220 70 280 120 330 130M0 50C80 60 120 30 190 14M150 190L200 120"/></g><g fill="#3b5645" stroke="#f6f1e7" stroke-opacity=".16"><rect x="128" y="102" width="40" height="26" rx="5"/><rect x="258" y="28" width="40" height="30" rx="5"/><rect x="36" y="104" width="46" height="28" rx="5"/><rect x="172" y="142" width="32" height="24" rx="5"/></g><text x="18" y="176" font-size="13" fill="#e9d7a8" fill-opacity=".85" font-style="italic" font-family="Playfair Display,serif">{{venue.mapLabel}}</text><g class="pin"><path d="M196 98C187 86 182 79 182 73a14 14 0 1 1 28 0c0 6-5 13-14 25z" fill="#c4745a"/><circle cx="196" cy="72" r="5.5" fill="#f6f1e7"/></g></svg></div>
  <a class="mb rv" href="{{venue.mapUrl}}" target="_blank" rel="noopener noreferrer">{{venue.mapButton}}</a>
  {{#if venue.note}}<p class="note rv">{{venue.note}}</p>{{/if}}
 </section>
